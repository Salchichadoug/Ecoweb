<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - EcoWeb</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p {
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .btn-google {
            display: inline-block;
            background-color: #4285F4;
            color: white;
            padding: 12px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
            width: 100%;
            box-sizing: border-box;
        }
        .btn-google:hover {
            background-color: #357ae8;
        }
        .flash-messages {
            margin-bottom: 20px;
            color: #e74c3c;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>EcoWeb</h1>
        <p>Monitoreo y administración de EcoDrop</p>

        <!-- Mensajes de error o alerta (ej: cuenta desactivada) -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-messages">
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <!-- Botón de acceso con Google configurado en app.py -->
        <a href="{{ url_for('login_google') }}" class="btn-google">
            Iniciar sesión con Google
        </a>
    </div>

</body>
</html>
